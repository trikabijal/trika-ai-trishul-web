[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- Just Talk downloads -------------------------------------------------------------------
# The DMG is NOT hosted here any more. It lives as a release asset in the PUBLIC repo
# trikabijal/justtalk-downloads, and GitHub's /releases/latest/download/<name> URL always resolves
# to the newest release's asset of that name. So the file changes every release while this URL —
# the one customers have — never does, and a Just Talk release never needs write access to this
# site again.
#
# Why it changed: releases used to commit a ~30 MB binary into public/downloads/ here. That grew
# this repo's history without bound (.git hit 60 MB, and history keeps it even after deletion) and
# on 2026-09-18 the release failed at that step because its token was missing — the build was
# notarized and correct, and the download silently stayed three weeks stale.
#
# The target repo must stay PUBLIC: release assets inherit repo visibility, and an asset in a
# private repo 404s for everyone without a token.
[[redirects]]
  from = "/downloads/Just-Talk.dmg"
  to = "https://github.com/trikabijal/justtalk-downloads/releases/latest/download/Just-Talk.dmg"
  status = 302
  force = true

# Archived versions: /downloads/v/1.3.1/Just-Talk.dmg → that release's own asset.
#
# The version MUST be its own path segment. An earlier attempt used
# `/downloads/Just-Talk-:version.dmg`, which silently never matched — Netlify's rule is that a
# placeholder "either matches a path segment from one / to the next / or matches a final path
# segment including a file extension", so it cannot share a segment with literal text. Same for
# splats: they are only valid at the end of a segment, never mid-segment. The broken rule looked
# right and did nothing, which is why /downloads/Just-Talk-1.3.1.dmg returned 404 while the older
# versions appeared to work — those were still being served by the committed files.
#
# NOT force = true: the legacy /downloads/Just-Talk-1.2.0.dmg and -1.3.0.dmg files are still
# committed under public/downloads/ and predate the downloads repo, so nothing to redirect them to.
# Leaving them served from disk keeps every link ever published working.
[[redirects]]
  from = "/downloads/v/:version/Just-Talk.dmg"
  to = "https://github.com/trikabijal/justtalk-downloads/releases/download/v:version/Just-Talk-:version.dmg"
  status = 302
  force = true
